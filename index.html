<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-wrapper {
            position: relative; /* Diperlukan agar overlay menutupi video */
            width: 100%;
            max-width: 450px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            object-fit: contain;
        }

        /* Layer transparan untuk mencegat klik 1 & 2 */
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <div id="overlay" class="click-overlay"></div>
    <video id="myVideo" controls poster="link-gambar-cover.jpg">
        <source src="https://github.com/user-attachments/assets/e2ea3c63-48f5-4e19-b9c2-857ca019a1ce" type="video/mp4">
        Browser Anda tidak mendukung pemutar video ini.
    </video>
</div>

<script>
    let clickCount = 0;
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('myVideo');

    // Ganti tautan di bawah ini sesuai kebutuhan
    const directLink = 'https://www.effectivecpmnetwork.com/tpnw86cx5g?key=4fcf0465a14766d5bfc7f998b84886c2';
    const shopeeLink = 'https://s.shopee.co.id/70J2Ftio0A';

    overlay.addEventListener('click', function() {
        clickCount++;

        if (clickCount === 1) {
            // Klik 1: Buka Directlink
            window.open(directLink, '_blank');
        } else if (clickCount === 2) {
            // Klik 2: Buka Shopee
            window.open(shopeeLink, '_blank');
        } else if (clickCount >= 3) {
            // Klik 3: Hilangkan overlay dan putar video
            overlay.style.display = 'none';
            video.play();
        }
    });
</script>

</body>
</html>
