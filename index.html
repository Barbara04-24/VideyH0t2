<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY - Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .video-card {
            width: 100%;
            max-width: 420px;
            background-color: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #27272a;
            padding: 16px;
        }

        /* --- JUDUL ESTETIK (POJOK KIRI ATAS) --- */
        .card-header {
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            /* Efek Warna Gradasi Teks */
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Efek Bayangan Halus (Glow) */
            filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.2));
            display: inline-block;
        }

        .video-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            object-fit: contain;
        }

        .action-area {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- TOMBOL MONETAG TEKS BERGERAK --- */
        .btn-running {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-running:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        /* Container Teks Berjalan */
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: runningText 12s linear infinite;
            padding-left: 100%; /* Memulai teks dari luar kanan tombol */
        }

        /* Animasi Pergerakan Teks */
        @keyframes runningText {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* Hentikan gerakan saat kursor diarahkan ke tombol (Hover) agar mudah diklik */
        .btn-running:hover .marquee-content {
            animation-play-state: paused;
        }

        /* Teks Penjelas Transparan */
        .sub-text {
            font-size: 11px;
            color: #a1a1aa;
            text-align: center;
            line-height: 1.4;
        }

        /* Tombol Sekunder (Shopee Affiliate) */
        .btn-shopee {
            display: block;
            background-color: #27272a;
            color: #e4e4e7;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            border: 1px solid #3f3f46;
            transition: background-color 0.2s;
        }

        .btn-shopee:hover {
            background-color: #3f3f46;
        }
    </style>
</head>
<body>

<div class="video-card">
    <!-- Judul Pojok Kiri Atas -->
    <div class="card-header">
        <h1 class="brand-title">VIDEYVIRAL</h1>
    </div>

    <!-- Pemutar Video Utama -->
    <div class="video-wrapper">
        <video id="myVideo" controls poster="link-gambar-cover.jpg">
            <source src="https://github.com/user-attachments/assets/e2ea3c63-48f5-4e19-b9c2-857ca019a1ce" type="video/mp4">
            Browser Anda tidak mendukung pemutar video ini.
        </video>
    </div>

    <div class="action-area">
        <!-- Tombol Monetag Teks Berjalan -->
        <a href="https://www.effectivecpmnetwork.com/tpnw86cx5g?key=4fcf0465a14766d5bfc7f998b84886c2" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-running">
            <div class="marquee-content">
                ⭐ DUKUNG KAMI AGAR SELALU UPDATE (Buka Sponsor) ⭐
            </div>
        </a>
        
        <p class="sub-text">
            Gratis tanpa biaya! Klik tombol di atas untuk melihat iklan sponsor dan membantu kami tetap mengunggah video.
        </p>

        <!-- Tombol Shopee Affiliate -->
        <a href="https://s.shopee.co.id/70J2Ftio0A" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-shopee">
            🛍️ VOCER SHOPEE 90% MINIMAL BELANJA 10RIBU
        </a>
    </div>
</div>

</body>
</html>
