<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY - Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .video-card {
            width: 100%;
            max-width: 420px;
            background-color: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #27272a;
            padding: 16px;
        }

        .video-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            object-fit: contain;
        }

        /* Container Tombol */
        .action-area {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Tombol Dukung Kami (Monetag SmartLink) */
        .btn-support {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-support:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        /* Animation Pulse untuk Menarik Perhatian */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(245, 158, 11, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
            }
        }

        /* Teks Penjelas Transparan */
        .sub-text {
            font-size: 11px;
            color: #a1a1aa;
            text-align: center;
            line-height: 1.4;
        }

        /* Tombol Sekunder (Shopee Affiliate) */
        .btn-shopee {
            display: block;
            background-color: #27272a;
            color: #e4e4e7;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            border: 1px solid #3f3f46;
            transition: background-color 0.2s;
        }

        .btn-shopee:hover {
            background-color: #3f3f46;
        }
    </style>
</head>
<body>

<div class="video-card">
    <!-- Pemutar Video Utama (Langsung Bisa Diputar) -->
    <div class="video-wrapper">
        <video id="myVideo" controls poster="link-gambar-cover.jpg">
            <source src="https://github.com/user-attachments/assets/e2ea3c63-48f5-4e19-b9c2-857ca019a1ce" type="video/mp4">
            Browser Anda tidak mendukung pemutar video ini.
        </video>
    </div>

    <div class="action-area">
        <!-- Tombol Utama Monetag (Desain Menonjol) -->
        <a href="https://www.effectivecpmnetwork.com/tpnw86cx5g?key=4fcf0465a14766d5bfc7f998b84886c2" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-support">
            <span>⭐</span> Dukung Kami (Buka Sponsor)
        </a>
        
        <p class="sub-text">
            Gratis tanpa biaya! Klik tombol di atas untuk melihat iklan sponsor dan membantu kami tetap mengunggah video.
        </p>

        <!-- Tombol Shopee Affiliate -->
        <a href="https://s.shopee.co.id/70J2Ftio0A" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-shopee">
           🛍️ Rekomendasi Produk Hari Ini
        </a>
    </div>
</div>

</body>
</html>
